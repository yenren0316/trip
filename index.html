<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>旅行行程</title>
<style>
  :root {
    color-scheme: light only;
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7078;
    --line: #e2ded5;
    --accent: #2f5d8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 24px; letter-spacing: .02em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a {
    display: block;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .name { font-size: 18px; font-weight: 600; }
  .date { font-size: 14px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>旅行行程</h1>
  <ul>
    <li><a href="hokkaido-2026-09/">
      <div class="name">北海道 7 天 6 夜</div>
      <div class="date">2026.9.4 – 9.10</div>
    </a></li>
    <li><a href="karuizawa-2026-11/">
      <div class="name">輕井澤 5 天 4 夜</div>
      <div class="date">2026.11.23 – 11.27</div>
    </a></li>
    <li><a href="sendai-yamagata-2027-01/">
      <div class="name">仙台・山形・藏王・銀山溫泉 7 天 6 夜</div>
      <div class="date">2027.1.24 – 1.30</div>
    </a></li>
  </ul>
</main>
</body>
</html>
